<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>LumaShift</title><link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png"><link rel="stylesheet" href="popup.css"></head><body>
<header><img class="logo" src="icons/icon-128.png" width="39" height="39" alt=""><div><h1>LumaShift</h1><p>让内容留在光里</p></div><span class="version">0.1</span></header>
<main><section class="global"><div><h2>深色转换</h2><p>应用于允许访问的网站</p></div><label class="switch"><input id="enabled" type="checkbox" aria-label="全局深色转换"><span></span></label></section>
<section class="status-card" aria-live="polite"><span class="indicator" id="indicator"></span><div><strong id="status">正在读取页面状态…</strong><p id="reason">正在连接当前标签页</p></div></section>
<section class="site"><div class="section-heading"><h2>当前网站</h2><span>仅此主机名</span></div><p id="hostname">—</p><fieldset id="modes"><legend class="sr-only">网站转换设置</legend><label><input type="radio" name="mode" value="auto"><span>自动</span></label><label><input type="radio" name="mode" value="force"><span>强制转换</span></label><label><input type="radio" name="mode" value="original"><span>保持原样</span></label></fieldset><p class="hint" id="mode-hint">自动识别页面当前的明暗状态</p></section>
<section class="colors"><div class="section-heading"><h2>全局配色</h2><button id="reset" class="text-button">恢复默认</button></div><div class="color-row"><label><input id="background" type="color" aria-label="主要背景色"><span>背景<small id="background-value">#181C24</small></span></label><label><input id="text" type="color" aria-label="主要文字色"><span>文字<small id="text-value">#DCE3ED</small></span></label></div><div id="preview"><span class="preview-label">Aa</span><div>舒适阅读，从这里开始<small>链接、强调与层次依然清晰</small></div></div><p id="contrast" class="hint"></p><p id="warning" role="status" hidden>这组颜色对比度偏低，文字可能不易阅读。你可以继续使用，或恢复默认配色。</p></section>
<p id="error" role="alert" hidden></p></main><footer><span class="privacy-dot"></span>本地处理 · 设置仅保存在此浏览器</footer><script type="module" src="popup.js"></script></body></html>
